<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transcripteur</title>
  <style>
    :root {
      --couleur-fond: #f6f6f6;
      --couleur-texte: #141414;
      --couleur-bandeau: #141414;
      --couleur-accent: #2b6cb0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--couleur-fond);
      color: var(--couleur-texte);
    }
    header {
      background: var(--couleur-bandeau);
      color: #ffffff;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo {
      width: 28px;
      height: 28px;
      background: var(--couleur-accent);
    }
    header h1 { margin: 0; font-size: 20px; }
    main { padding: 24px 16px; }
  </style>
</head>
<body>
  <header>
    <div class="logo"></div>
    <h1>Transcripteur</h1>
  </header>
  <main>
    <p>Transcripteur, version de test.</p>
  </main>
</body>
</html>
